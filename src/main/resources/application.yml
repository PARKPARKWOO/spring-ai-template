spring:
  application:
    name: ${spring.profiles.active:dev}-spring-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 60s
  mvc:
    async:
      request-timeout: 120000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:my-secret-pw}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
    repair-on-migrate: true
    clean-disabled: true
  ai:
    model:
      chat: none
      embedding: none

# API Key encryption (AES-256-GCM)
api:
  key:
    secret-base64: ${API_KEY_SECRET_BASE64:}


# SpringDoc OpenAPI (Swagger) 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# 캐시 설정 (Caffeine)
cache:
  max-size: 10000
  default-ttl-minutes: 5

# gRPC 서버 설정 (net.devh)
grpc:
  server:
    port: ${GRPC_PORT:9090}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 5m
  tomcat:
    connection-timeout:
    max-keep-alive-requests: 200
  shutdown: graceful

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
    hostname: spring-ai

# APM (Pyroscope)
pyroscope:
  server:
    address: ${PYROSCOPE_SERVER_ADDRESS:http://localhost:4040}

# Actuator / Prometheus
management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
