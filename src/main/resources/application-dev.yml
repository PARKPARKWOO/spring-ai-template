spring:
  config:
    activate:
      on-profile: dev
  ai:
    openai:
      api-key: test
    anthropic:
      api-key: test
    google:
      genai:
        api-key: test
    vertex:
      ai:
        gemini:
          project-id: "ddd"
          location: "dd"
    grok:
      api-key: test
  mvc:
    async:
      request-timeout: 120000  # 60초 (밀리초 단위)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai
    username: root
    password: my-secret-pw
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    repair-on-migrate: true  # 마이그레이션 실행 전 체크섬 불일치 자동 수정
    validate-on-migrate: false  # 개발 환경에서 체크섬 검증 비활성화 (repair가 먼저 실행되도록)
server:
  port: 8081

# SpringDoc OpenAPI (Swagger) 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false